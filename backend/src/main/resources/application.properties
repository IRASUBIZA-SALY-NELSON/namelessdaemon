spring.application.name=manager-backend

# MongoDB Atlas
spring.data.mongodb.uri=mongodb+srv://taskmanager:taskmanager@tasks.so4z3xg.mongodb.net/?appName=tasks
spring.data.mongodb.database=tasks

# Show MongoDB queries
spring.data.mongodb.show-queries=true

# Health endpoints
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# CORS Configuration
spring.web.cors.allowed-origins=http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173

# Allow null JSON fields for omitted admin form booleans (legacy clients)
spring.jackson.deserialization.fail-on-null-for-primitives=false
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true
spring.web.cors.exposed-headers=Content-Type,Authorization

# Port — Render injects PORT, fallback to 8081 locally
server.port=${PORT:8082}

